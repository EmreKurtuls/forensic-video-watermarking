<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Studio</title>
<meta name="description" content="Pick a film and a cipher, hide an encrypted viewer ID in it with the project code, and compare the film before and after.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

@import url("./tokens.css");
@import url("./base.css");

body { font-size: 1.0625rem; }
.bar { border-bottom: var(--rule-hair) solid var(--color-rule); background: var(--color-paper); }
.bar__in { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); height: 64px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); letter-spacing: var(--tracking-display); }
.status { font-size: var(--text-sm); color: var(--color-muted); }
.status.is-bad { color: var(--color-error); }

.main { max-width: var(--container); margin-inline: auto; padding: var(--space-lg) var(--gutter) var(--space-2xl); display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: var(--gap-columns); align-items: start; }
.panel { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper); box-shadow: var(--shadow-card); padding: var(--space-lg); display: grid; gap: var(--space-md); }
@supports (corner-shape: bevel) { .panel { border-radius: var(--cut-l) 4px var(--cut-l) 4px; corner-shape: bevel round bevel round; } }
.controls { position: sticky; top: var(--space-lg); }
.panel h2 { font-size: var(--text-xl); }
.field { display: grid; gap: var(--space-2xs); }
.field > label, .field > .label { font-family: var(--font-display); font-weight: 500; font-size: var(--text-sm); color: var(--color-muted); }
select, input[type="number"] { min-height: 44px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-muted); border-radius: var(--radius-input); background: var(--color-paper); color: var(--color-ink); font: inherit; width: 100%; }
select:focus-visible, input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 1px; border-color: var(--color-accent); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-sm); }
.tray { display: flex; gap: var(--space-2xs); padding: var(--space-2xs); background: var(--color-paper-3); border-radius: var(--radius-input); }
.tray .key { flex: 1; }

.key { border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-input); padding: 0 var(--space-md); min-height: 44px; background: var(--color-key-face); color: var(--color-ink); font: 500 var(--text-md)/1 var(--font-display); box-shadow: var(--shadow-key); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out); }
.key:hover { transform: translateY(-1px); }
.key:active, .key[aria-pressed="true"] { transform: translateY(2px); box-shadow: var(--shadow-key-press); }
.key[aria-pressed="true"] { color: var(--color-accent-deep); border-color: var(--color-accent); background: var(--color-accent-wash); }
.key:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; transition: none; }
.key:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
.key--primary { background: var(--color-accent); border-color: var(--color-accent-edge); color: var(--color-accent-ink); box-shadow: var(--shadow-key-accent); width: 100%; min-height: 48px; }
.key--primary:active { background: var(--color-accent-deep); }
.key--small { min-height: 36px; font-size: var(--text-sm); white-space: nowrap; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload { position: relative; }
.upload label.key { width: 100%; }
.upload input:focus-visible + label { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.note { font-size: var(--text-sm); color: var(--color-muted); }

.progress { display: grid; gap: var(--space-2xs); }
.progress__track { height: 6px; background: var(--color-paper-3); border-radius: var(--radius-pill); overflow: hidden; }
.progress__fill { height: 100%; width: 100%; background: var(--color-accent); transform-origin: left center; transform: scaleX(0); transition: transform var(--dur-short) var(--ease-out); }
.progress.is-indeterminate .progress__fill { transform: scaleX(0.3); animation: slide 1.2s var(--ease-in-out) infinite; }
@keyframes slide { from { transform: translateX(-100%) scaleX(0.3); } to { transform: translateX(340%) scaleX(0.3); } }

.result { display: grid; gap: var(--space-lg); min-width: 0; }
.empty { min-height: 420px; display: grid; place-items: center; text-align: center; color: var(--color-muted); }
.empty h2 { color: var(--color-ink); margin-bottom: var(--space-xs); }
.error { color: var(--color-error); }
.graphite { background: var(--color-graphite); color: var(--color-graphite-ink); border-radius: var(--radius-input); padding: var(--space-md); font-family: var(--font-outlier); font-size: 0.875rem; line-height: 1.6; display: grid; gap: var(--space-sm); overflow-x: auto; }
.graphite .c { color: var(--color-graphite-muted); }
.graphite .v { color: var(--color-accent-2); }
.flow { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-md); align-items: baseline; }
.bits { display: grid; grid-template-columns: repeat(47, minmax(0, 1fr)); gap: var(--space-3xs); max-width: 40rem; }
.bits span { aspect-ratio: 1; background: var(--color-graphite-glyph-1); }
.bits span.b1 { background: var(--color-accent-2); }

.compare { position: relative; overflow: hidden; border-radius: var(--radius-input); border: var(--rule-hair) solid var(--color-rule); background: var(--color-graphite); }
.compare img { display: block; width: 100%; height: auto; }
.compare .top { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--cut-at, 50%)); }
.compare .line { position: absolute; top: 0; bottom: 0; left: var(--cut-at, 50%); width: 2px; margin-left: -1px; background: var(--color-accent); pointer-events: none; }
.compare .tag { position: absolute; top: var(--space-xs); padding: var(--space-3xs) var(--space-xs); background: var(--color-paper); color: var(--color-ink); font: 500 var(--text-sm)/1.3 var(--font-display); border-radius: 4px; }
.compare .tag--l { left: var(--space-xs); } .compare .tag--r { right: var(--space-xs); }
.compare.is-diff .top, .compare.is-diff .line, .compare.is-diff .tag { display: none; }
input[type="range"] { width: 100%; accent-color: var(--color-accent); }
input[type="range"]:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-md); flex-wrap: wrap; }
.head-row h3 { font-size: var(--text-lg); }

.videos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-sm); }
.videos figure { margin: 0; display: grid; gap: var(--space-2xs); }
.videos video { width: 100%; border-radius: var(--radius-input); background: var(--color-graphite); }
figcaption { font-size: var(--text-sm); color: var(--color-muted); }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-sm); }
.stat { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-input); padding: var(--space-sm); display: grid; gap: var(--space-3xs); background: var(--color-paper); }
.stat b { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); letter-spacing: var(--tracking-display); font-variant-numeric: tabular-nums; color: var(--color-ink); }
.stat span { font-size: var(--text-sm); color: var(--color-muted); }

.noscript { max-width: 60ch; margin: var(--space-3xl) auto; padding-inline: var(--gutter); }
@media (max-width: 60rem) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .controls { position: static; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .videos { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .progress.is-indeterminate .progress__fill { animation: none; transform: scaleX(1); opacity: 0.5; } }
</style>
</head>
<body>
<noscript><div class="noscript"><h1>Mark studio</h1><p>This page needs JavaScript and the local server: PYTHONPATH=src .venv/bin/python scripts/mark_studio.py</p></div></noscript>
<header class="bar"><div class="bar__in"><span class="wordmark">Mark studio</span><span class="status" id="status">Connecting to the local server…</span></div></header>

<main class="main">
  <section class="panel controls" aria-labelledby="ctl-h">
    <h2 id="ctl-h">Mark a film</h2>
    <div class="field">
      <label for="film">Film</label>
      <select id="film" disabled><option>Loading…</option></select>
    </div>
    <div class="upload">
      <input type="file" id="file" accept="video/*,.mkv,.y4m">
      <label class="key key--small" for="file">Upload a video</label>
    </div>
    <div class="field">
      <span class="label" id="alg-l">Cipher for the ID</span>
      <div class="tray" role="group" aria-labelledby="alg-l">
        <button class="key" type="button" data-alg="PRESENT-128" aria-pressed="true">PRESENT-128</button>
        <button class="key" type="button" data-alg="FF1" aria-pressed="false">FF1</button>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label for="user">Viewer ID</label><input type="number" id="user" min="0" max="4294967295" value="1002"></div>
      <div class="field"><label for="session">Session</label><input type="number" id="session" min="0" max="16777215" value="0"></div>
    </div>
    <div class="field">
      <label for="seconds">Mark the first</label>
      <select id="seconds"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="20">20 seconds</option><option value="30">30 seconds</option><option value="60">60 seconds</option></select>
    </div>
    <button class="key key--primary" type="button" id="go" disabled>Mark the film</button>
    <div class="progress" id="prog" hidden>
      <span class="note" id="stage">Starting…</span>
      <div class="progress__track"><div class="progress__fill" id="fill"></div></div>
    </div>
    <p class="note">The film is not encrypted. The viewer’s ID is: encrypted, tagged, error-protected, then hidden in every frame.</p>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="panel empty" id="empty"><div><h2>Nothing marked yet</h2><p>Pick a film and a cipher on the left, then press Mark the film.</p></div></div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let alg = "PRESENT-128", busy = false;
  const status = (t, bad = false) => { $("status").textContent = t; $("status").classList.toggle("is-bad", bad); };

  async function loadFilms(selectId) {
    try {
      const films = await (await fetch("/api/films")).json();
      const sel = $("film");
      sel.innerHTML = "";
      for (const kind of ["test clip", "uploaded"]) {
        const list = films.filter((f) => f.kind === kind);
        if (!list.length) continue;
        const g = document.createElement("optgroup");
        g.label = kind === "test clip" ? "Test clips" : "Uploaded";
        for (const f of list) {
          const o = document.createElement("option");
          o.value = f.id;
          o.textContent = `${f.name}  (${f.width}×${f.height}${f.seconds ? `, ${f.seconds} s` : ""})`;
          g.append(o);
        }
        sel.append(g);
      }
      if (selectId) sel.value = selectId;
      sel.disabled = !films.length;
      $("go").disabled = !films.length || busy;
      status(films.length ? `Local server ready, ${films.length} films` : "No films found in data/clips");
    } catch (e) {
      status("Local server not reachable. Start scripts/mark_studio.py", true);
    }
  }

  document.querySelectorAll("[data-alg]").forEach((b) => b.addEventListener("click", () => {
    alg = b.dataset.alg;
    document.querySelectorAll("[data-alg]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));

  $("file").addEventListener("change", async () => {
    const f = $("file").files[0];
    if (!f) return;
    status(`Uploading ${f.name}…`);
    try {
      const r = await fetch(`/api/upload?name=${encodeURIComponent(f.name)}`, { method: "POST", body: f });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "upload failed");
      await loadFilms(j.id);
      status(`Uploaded ${f.name}`);
    } catch (e) { status(`Upload failed: ${e.message}`, true); }
    $("file").value = "";
  });

  $("go").addEventListener("click", async () => {
    if (busy) return;
    busy = true; $("go").disabled = true;
    const prog = $("prog"); prog.hidden = false;
    setProgress("Starting…", null);
    try {
      const r = await fetch("/api/mark", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ film: $("film").value, alg, user: $("user").value, session: $("session").value, seconds: $("seconds").value }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "could not start");
      await poll(j.id);
    } catch (e) {
      showError(e.message);
    } finally {
      busy = false; $("go").disabled = false;
    }
  });

  function setProgress(stage, frac) {
    $("stage").textContent = frac == null ? stage : `${stage}, ${Math.round(frac * 100)} %`;
    $("prog").classList.toggle("is-indeterminate", frac == null);
    $("fill").style.transform = frac == null ? "" : `scaleX(${Math.max(0.02, frac)})`;
  }

  async function poll(id) {
    for (;;) {
      const job = await (await fetch(`/api/job?id=${id}`)).json();
      if (job.stage === "done") { setProgress("Done", 1); render(id, job.result); return; }
      if (job.stage === "error") throw new Error(job.error);
      setProgress(job.stage, job.progress);
      await new Promise((res) => setTimeout(res, 400));
    }
  }

  function showError(msg) {
    $("prog").hidden = true;
    $("result").innerHTML = `<div class="panel empty"><div><h2>Marking failed</h2><p class="error"></p><p>Check the film and press Mark the film again.</p></div></div>`;
    $("result").querySelector(".error").textContent = msg;
  }

  function render(id, r) {
    const out = (f) => `/out/${id}/${f}?t=${Date.now()}`;
    const bits = [...r.codeword].map((b) => `<span class="${b === "1" ? "b1" : ""}"></span>`).join("");
    const h = r.block;
    $("result").innerHTML = `
      <div class="panel">
        <div class="head-row"><h3>${esc(r.film)}: user ${r.user}, session ${r.session}, ${esc(r.alg)}</h3><span class="note">${r.width}×${r.height}, ${r.frames} frames, ${r.seconds} s</span></div>
        <div class="graphite">
          <div class="flow"><span class="c">block</span><span><span class="v">${h[0]}</span> <span class="v">${h.slice(1, 9)}</span> <span class="v">${h.slice(9, 15)}</span> <span class="v">${h[15]}</span></span><span class="c">VER | user_id | session | reserved</span></div>
          <div class="flow"><span class="c">${esc(r.alg)} →</span><span class="v">${r.ciphertext}</span><span class="c">SipHash tag</span><span class="v">${r.tag}</span><span class="c">film_id ${esc(r.film_id)}</span></div>
          <div><div class="c" style="margin-bottom:var(--space-2xs)">188 bits hidden in the film (64 ciphertext + 32 tag + 92 BCH parity)</div><div class="bits" aria-hidden="true">${bits}</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="head-row"><h3>Frame ${r.still_frame}, before and after</h3>
          <div class="tray" role="group" aria-label="View"><button class="key key--small" type="button" id="v-cmp" aria-pressed="true">Compare</button><button class="key key--small" type="button" id="v-diff" aria-pressed="false">Difference ×20</button></div></div>
        <div class="compare" id="cmp" style="--cut-at:50%">
          <img src="${out("original.png")}" alt="Original frame" id="img-base">
          <img class="top" src="${out("marked.png")}" alt="Marked frame">
          <span class="line"></span><span class="tag tag--l">Original</span><span class="tag tag--r">Marked</span>
        </div>
        <input type="range" id="wipe" min="0" max="100" value="50" aria-label="Move the line between original and marked">
      </div>
      <div class="panel">
        <div class="head-row"><h3>The videos</h3><button class="key key--small" type="button" id="both">Play both</button></div>
        <div class="videos">
          <figure><video id="vo" src="${out("original.mp4")}" muted playsinline controls preload="metadata"></video><figcaption>Original</figcaption></figure>
          <figure><video id="vm" src="${out("marked.mp4")}" muted playsinline controls preload="metadata"></video><figcaption>Marked for user ${r.user}</figcaption></figure>
        </div>
        <p class="note">Previews are H.264 (CRF 16) so the browser can play them; the marked master is lossless.</p>
      </div>
      <div class="stats">
        <div class="stat"><b>${r.psnr_y} dB</b><span>PSNR (Y), mean</span></div>
        <div class="stat"><b>${r.ssim_y}</b><span>SSIM (Y), mean</span></div>
        <div class="stat"><b>${r.max_change}</b><span>largest pixel change, of 255</span></div>
        <div class="stat"><b>${r.encode_us} µs</b><span>encrypt + tag + BCH</span></div>
        <div class="stat"><b>${r.embed_s} s</b><span>to embed ${r.seconds} s of video</span></div>
      </div>`;
    const cmp = $("cmp");
    $("wipe").addEventListener("input", (e) => cmp.style.setProperty("--cut-at", e.target.value + "%"));
    const setView = (diff) => {
      cmp.classList.toggle("is-diff", diff);
      $("img-base").src = out(diff ? "diff20.png" : "original.png");
      $("img-base").alt = diff ? "Difference between marked and original, times 20" : "Original frame";
      $("wipe").hidden = diff;
      $("v-cmp").setAttribute("aria-pressed", String(!diff)); $("v-diff").setAttribute("aria-pressed", String(diff));
    };
    $("v-cmp").addEventListener("click", () => setView(false));
    $("v-diff").addEventListener("click", () => setView(true));
    $("both").addEventListener("click", () => { const a = $("vo"), b = $("vm"); a.currentTime = 0; b.currentTime = 0; a.play(); b.play(); });
    $("result").scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  loadFilms();

  const jid = new URLSearchParams(location.search).get("job");
  if (jid && /^[0-9a-f]{32}$/.test(jid)) { $("prog").hidden = false; poll(jid).catch((e) => showError(e.message)); }
})();
</script>
</body>
</html>

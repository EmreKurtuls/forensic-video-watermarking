<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Mark</title>
<meta name="description" content="A two-alternative forced-choice viewing test: in each pair of clips, pick the one that carries the watermark.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>

@import url("./tokens.css");
@import url("./base.css");

body { font-size: 1.125rem; }
.bar { border-bottom: var(--rule-hair) solid var(--color-rule); }
.bar__in { max-width: var(--container); margin-inline: auto; padding: 0 var(--gutter); height: 64px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); letter-spacing: var(--tracking-display); }
.count { font-family: var(--font-display); font-weight: 500; font-size: var(--text-sm); color: var(--color-muted); font-variant-numeric: tabular-nums; }
.main { max-width: 64rem; margin-inline: auto; padding: var(--space-xl) var(--gutter) var(--space-2xl); display: grid; gap: var(--space-lg); justify-items: center; text-align: center; }
.main h1 { font-size: var(--text-2xl); max-width: 24ch; }
.main p { color: var(--color-ink-2); max-width: 52ch; }
.screen { width: 100%; min-height: 380px; display: grid; place-items: center; background: var(--color-graphite); border-radius: var(--radius-card); padding: var(--space-md); }
.screen video { max-width: 100%; height: auto; background: var(--color-graphite); }
.screen__label { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); color: var(--color-graphite-ink); }
.row { display: flex; gap: var(--space-sm); flex-wrap: wrap; justify-content: center; }
.key { border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-input); padding: 0 var(--space-lg); min-height: 48px; min-width: 48px; background: var(--color-key-face); color: var(--color-ink); font: 500 var(--text-md)/1 var(--font-display); box-shadow: var(--shadow-key); cursor: pointer; transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out); }
.key:hover { transform: translateY(-1px); }
.key:active { transform: translateY(3px); box-shadow: var(--shadow-key-press); }
.key:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; transition: none; }
.key:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
.key[aria-pressed="true"] { border-color: var(--color-accent); color: var(--color-accent-deep); background: var(--color-accent-wash); }
.key--primary { background: var(--color-accent); border-color: var(--color-accent-edge); color: var(--color-accent-ink); box-shadow: var(--shadow-key-accent); }
.field { display: grid; gap: var(--space-2xs); text-align: left; }
.field label { font-family: var(--font-display); font-weight: 500; font-size: var(--text-sm); color: var(--color-muted); }
.field input { min-height: 44px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-muted); border-radius: var(--radius-input); background: var(--color-paper); color: var(--color-ink); font: inherit; }
.field input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 1px; border-color: var(--color-accent); }
.note { font-size: var(--text-sm); color: var(--color-muted); }
.hint { font-size: var(--text-sm); color: var(--color-muted); min-height: 1.5em; }
.noscript { max-width: 60ch; margin: var(--space-3xl) auto; padding-inline: var(--gutter); }
</style>
</head>
<body>
<noscript><div class="noscript"><h1>Spot the mark</h1><p>This test needs JavaScript.</p></div></noscript>
<header class="bar"><div class="bar__in"><span class="wordmark">Spot the mark</span><span class="count" id="count"></span></div></header>
<main class="main" id="main" aria-live="polite"></main>

<script src="./clips/manifest.js"></script>
<script>
(() => {
  const CL = window.CLIPS || [];
  const REPS = 1;
  const main = document.getElementById("main"), count = document.getElementById("count");
  let trials = [], k = 0, who = "", t0 = 0, plays = { A: 0, B: 0 };
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function intro() {
    count.textContent = "";
    if (!CL.length) { main.innerHTML = `<h1>No clips found</h1><p>Run scripts/make_2afc_clips.py first.</p>`; return; }
    main.innerHTML = `
      <h1>Which clip carries the hidden mark?</h1>
      <p>You will see ${CL.length * REPS} pairs. In each pair one clip is the original and one carries an invisible watermark. Play A and B as often as you like, then pick the one you think is marked. If you cannot tell, guess.</p>
      <p class="note">Use full screen brightness and sit at your normal viewing distance. It takes about five minutes.</p>
      <div class="field"><label for="who">Participant code (no names)</label><input id="who" autocomplete="off" maxlength="24" placeholder="p01"></div>
      <button class="key key--primary" type="button" id="start">Start</button>`;
    document.getElementById("start").onclick = () => {
      who = (document.getElementById("who").value || "anon").replace(/[^\w-]/g, "").slice(0, 24) || "anon";
      trials = shuffle(CL.flatMap((c) => Array.from({ length: REPS }, (_, r) => ({ clip: c.clip, part: c.part, rep: r, c, markedSide: Math.random() < 0.5 ? "A" : "B" }))));
      k = 0; trial();
    };
  }

  function trial() {
    const t = trials[k], c = t.c;
    const src = { A: t.markedSide === "A" ? c.marked : c.original, B: t.markedSide === "B" ? c.marked : c.original };
    plays = { A: 0, B: 0 }; t0 = performance.now();
    count.textContent = `Pair ${k + 1} of ${trials.length}`;
    main.innerHTML = `
      <div class="screen"><video id="v" width="${c.width}" height="${c.height}" muted playsinline preload="auto"></video><span class="screen__label" id="lab">Press Play A</span></div>
      <div class="row"><button class="key" type="button" id="pA">Play A</button><button class="key" type="button" id="pB">Play B</button></div>
      <div class="row"><button class="key" type="button" id="aA" disabled>A is marked</button><button class="key" type="button" id="aB" disabled>B is marked</button></div>
      <p class="hint" id="hint">Play both clips at least once to answer.</p>`;
    const v = document.getElementById("v"), lab = document.getElementById("lab");
    v.hidden = true;
    const play = (side) => {
      plays[side]++; v.hidden = false; lab.hidden = true;
      v.src = "clips/" + src[side]; v.currentTime = 0; v.play().catch(() => {});
      document.getElementById("pA").setAttribute("aria-pressed", side === "A");
      document.getElementById("pB").setAttribute("aria-pressed", side === "B");
      if (plays.A && plays.B) { document.getElementById("aA").disabled = false; document.getElementById("aB").disabled = false; document.getElementById("hint").textContent = ""; }
    };
    document.getElementById("pA").onclick = () => play("A");
    document.getElementById("pB").onclick = () => play("B");
    const answer = (side) => {
      Object.assign(t, { answer: side, correct: side === t.markedSide, playsA: plays.A, playsB: plays.B, ms: Math.round(performance.now() - t0) });
      k++; k < trials.length ? trial() : done();
    };
    document.getElementById("aA").onclick = () => answer("A");
    document.getElementById("aB").onclick = () => answer("B");
  }

  function done() {
    count.textContent = "";
    const rows = trials.map(({ c, ...r }) => r);
    const blob = new Blob([JSON.stringify({ participant: who, finished: new Date().toISOString(), trials: rows }, null, 1)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    main.innerHTML = `
      <h1>Thank you</h1>
      <p>Save your results and send the file to the person running the test.</p>
      <a class="key key--primary" id="dl" href="${url}" download="2afc_${who}_${Date.now()}.json" style="display:inline-flex;align-items:center;text-decoration:none">Save results</a>`;
  }
  intro();
})();
</script>
</body>
</html>
